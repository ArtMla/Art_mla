name: Deploy to ECR

on:
  push:
    branches: [main]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}

jobs:
  push-images:
    name: Build and push Docker images to ECR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        env:
          REPO: ${{ secrets.ECR_REPOSITORY_PRED_MAINT_API }}
          SHA: ${{ github.sha }}
        run: |
          docker build -f api/Dockerfile . \
            -t $ECR_REGISTRY/$REPO:latest \
            -t $ECR_REGISTRY/$REPO:$SHA
          docker push $ECR_REGISTRY/$REPO:latest
          docker push $ECR_REGISTRY/$REPO:$SHA

      - name: Build and push dashboard image
        env:
          REPO: ${{ secrets.ECR_REPOSITORY_PRED_MAINT_DASHBOARD }}
          SHA: ${{ github.sha }}
        run: |
          docker build dashboard/ \
            -t $ECR_REGISTRY/$REPO:latest \
            -t $ECR_REGISTRY/$REPO:$SHA
          docker push $ECR_REGISTRY/$REPO:latest
          docker push $ECR_REGISTRY/$REPO:$SHA

      - name: Job summary
        run: |
          echo "### Images pushed to ECR" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ secrets.ECR_REPOSITORY_PRED_MAINT_API }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ secrets.ECR_REPOSITORY_PRED_MAINT_DASHBOARD }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**ECS deploy (manual):** \`make push-ecs\`" >> $GITHUB_STEP_SUMMARY

  # ECS service update is intentionally manual via `make push-ecs` to control costs.
  # To automate: add an `ecs-deploy` job here calling `aws ecs update-service`.
