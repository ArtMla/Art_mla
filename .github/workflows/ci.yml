name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check . --select E,W,F --exclude dashboard/ --exclude src/

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          pip install \
            pytest pytest-asyncio httpx \
            numpy pandas pyarrow psycopg2-binary \
            pandera xgboost scikit-learn \
            pydantic fastapi asyncpg boto3 \
            pytest-mock matplotlib
      - name: Run tests
        run: pytest tests/ -v --tb=short

  docker-build-api:
    name: Docker build — api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f api/Dockerfile . -t pred-maint-api:ci

  docker-build-dashboard:
    name: Docker build — dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build dashboard/ -t pred-maint-dashboard:ci
